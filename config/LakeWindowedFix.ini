[window]
; Initial window CLIENT area in logical pixels, clamped to the work area.
; Scaled mode keeps the complete legacy UI on a separate virtual canvas.
Width=1024
Height=576

[compatibility]
; Default: resize/maximize the window, NOT the legacy renderer resources.
ScaleRendering=1
; Leave at 0. NativeResize=1 disables scaling and enables EXPERIMENTAL rebuilds.
NativeResize=0

[render]
; Fixed virtual canvas, ~29% smaller than 1536x864 for larger controls.
; Minimum supported configuration: 1024x600. Set before starting Lake.
; The presentation and mouse coordinates are scaled to the actual window.
Width=1088
Height=612
