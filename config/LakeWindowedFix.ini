[window]
; Initial CLIENT area in pixels. Invalid values use the defaults below.
; The host has a minimum client area of 800x600, as required by the Lake UI.
Width=1024
Height=768

[compatibility]
; Diagnostic default after the real 0.2 startup exit. 0 keeps the native
; framebuffer size and disables graphics rebuild/interactive resizing.
; 1 is EXPERIMENTAL: permits the legacy teardown/rebuild and Width/Height.
NativeResize=0
