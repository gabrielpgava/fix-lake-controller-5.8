name: Windows x86 candidate (no Lake, no publishing)
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
    inputs:
      retain_own_symbols:
        description: 'Explicitly upload own private-path-bearing symbols for 7 days (never operator package)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-x86-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolchain: [Zig, MSVC]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate x86 MSVC (no global environment changes)
        if: matrix.toolchain == 'MSVC'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dev = Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1'
          & $dev -Arch x86 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in 'PATH','INCLUDE','LIB','LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Prepare pinned Zig 0.14.1
        if: matrix.toolchain == 'Zig'
        shell: powershell
        run: python -m pip install --target build-tools/python ziglang==0.14.1
      - name: Prepare verified LLVM objcopy (not a compiler replacement)
        if: matrix.toolchain == 'Zig'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = New-Item -ItemType Directory -Path build-tools/llvm-symbols-20261020 -Force
          $archive = Join-Path $directory.FullName 'llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'LLVM symbols archive hash mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -cmatch '^[^/]+/bin/(?:llvm-objcopy\.exe|[^/]+\.dll)$') {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path $directory.FullName $entry.Name),$false)
              }
            }
          } finally { $zip.Dispose() }
          & (Join-Path $directory.FullName 'llvm-objcopy.exe') --version
          if ($LASTEXITCODE) { throw 'LLVM objcopy cannot start.' }
      - name: Compile and test exact runtime
        shell: powershell
        run: |
          $options = @{ Toolchain='${{ matrix.toolchain }}'; Configuration='Release'; BuildDirectory='build-ci-runtime'; OutputDirectory='dist-ci-runtime' }
          if ($options.Toolchain -eq 'Zig') { $options.ZigPath = '.\build-tools\python\ziglang\zig.exe' }
          .\scripts\Build.ps1 @options
      - name: Compile setup phase two and test sandbox/payload/localization
        shell: powershell
        run: |
          $options = @{ Toolchain='${{ matrix.toolchain }}'; RuntimeDirectory='dist-ci-runtime'; OutputDirectory='dist-ci-setup'; BuildDirectory='build-ci-setup'; AllowUnsignedDevelopment=$true }
          if ($options.Toolchain -eq 'Zig') { $options.ZigPath = '.\build-tools\python\ziglang\zig.exe' }
          .\scripts\Build-Installer.ps1 @options
      - name: Package and validate work-branch candidate, never publication
        shell: powershell
        run: |
          .\scripts\New-ReleasePackage.ps1 -RuntimeDirectory dist-ci-runtime -InstallerDirectory dist-ci-setup -OutputDirectory out/ci-candidate -AllowUnsignedDevelopment
          .\scripts\Test-Candidate.ps1 -PackageDirectory out/ci-candidate -AllowUnsignedDevelopment
          .\tests\Provenance.Test.ps1
          .\tests\Release-Package.Test.ps1 -PackageDirectory out/ci-candidate
          $manifest = Get-Content build-ci-runtime/BUILD-PROVENANCE.json -Raw | ConvertFrom-Json
          .\tests\Link-Symbols.Test.ps1 -SymbolDirectory "build-ci-runtime/symbols/$($manifest.BuildId)" -BinaryDirectory dist-ci-runtime -BuildId $manifest.BuildId
      - name: Record desktop coverage limitation
        shell: powershell
        run: |
          'NOT EXECUTED: real GPU/desktop pixels, proprietary Lake OFFLINE, audio/hardware, signing and publication preflight.' | Set-Content build-ci-runtime/DESKTOP-NOT-EXECUTED.txt
      - name: Show failed synthetic test evidence
        if: failure()
        shell: powershell
        run: |
          foreach ($directory in 'build-ci-runtime/.build-evidence','build-ci-setup/.build-evidence') {
            if (Test-Path -LiteralPath $directory) {
              Get-ChildItem -LiteralPath $directory -Recurse -File -Filter '*.txt' -Force | ForEach-Object {
                if (Select-String -LiteralPath $_.FullName -Pattern '^ExitCode: [^0]' -Quiet) {
                  Write-Host "Synthetic evidence: $($_.Name)"
                  Get-Content -LiteralPath $_.FullName -Tail 100
                  Select-String -LiteralPath $_.FullName -Pattern '^FAIL:|fixture infrastructure error'
                }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-evidence-${{ matrix.toolchain }}-x86
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build-ci-runtime/BUILD-PROVENANCE.json
            build-ci-runtime/.build-evidence/**
            build-ci-runtime/DESKTOP-NOT-EXECUTED.txt
            build-ci-setup/BUILD-PROVENANCE.json
            build-ci-setup/.build-evidence/**
            out/ci-candidate/RELEASE-MANIFEST.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.retain_own_symbols
        with:
          name: own-symbols-${{ matrix.toolchain }}-x86
          if-no-files-found: error
          retention-days: 7
          path: |
            build-ci-runtime/symbols/**
            build-ci-setup/symbols/**
  # No signing/upload/release job and no signing credentials in this workflow.
  # A future authorized signing job must run reviewed code separately, never a
  # pull_request/fork payload. Skipped GPU work above is not a passing test.
